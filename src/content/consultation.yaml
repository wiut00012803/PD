faq:
  enabled: true
  overline:
    ru: FAQ
    uz: FAQ
    en: FAQ
  title:
    ru: О консультации
    uz: Maslahat haqida
    en: About the consultation
  subtitle:
    ru: Остались вопросы? Напишите — ответим лично.
    uz: Savollar qoldimi? Yozing — shaxsan javob beramiz.
    en: Still have questions? Message us — we’ll reply personally.
  items:
    - question:
        ru: Это правда бесплатно?
        uz: Bu haqiqatan ham bepulmi?
        en: Is it really free?
      answer:
        ru: Да. Первая консультация бесплатна и ни к чему вас не обязывает. Если решите работать с нами, стоимость согласуем заранее и зафиксируем в договоре.
        uz: Ha. Birinchi maslahat bepul va sizni hech narsaga majbur qilmaydi. Biz bilan ishlashga qaror qilsangiz, narxni oldindan kelishib, shartnomada qayd etamiz.
        en: Yes. The first consultation is free and you’re under no obligation. If you decide to work with us, we’ll agree on the fee in advance and put it in the contract.
    - question:
        ru: Сколько длится консультация?
        uz: Maslahat qancha davom etadi?
        en: How long does a consultation take?
      answer:
        ru: Обычно 30–40 минут. Этого хватает, чтобы разобраться в ситуации, оценить шансы и наметить план. Если дело сложное, договоримся о следующей встрече.
        uz: Odatda 30–40 daqiqa. Bu vaziyatni tushunish, imkoniyatlarni baholash va reja tuzish uchun yetarli. Ish murakkab boʻlsa, keyingi uchrashuvni kelishib olamiz.
        en: Usually 30–40 minutes — enough to understand the situation, assess your chances and outline a plan. If the case is complex, we’ll arrange a follow-up meeting.
    - question:
        ru: Какие документы подготовить?
        uz: Qanday hujjatlarni tayyorlash kerak?
        en: What documents should I prepare?
      answer:
        ru: "Всё, что относится к делу: договоры, переписку, решения и постановления, повестки, квитанции. Если документов нет — ничего страшного: юрист подскажет, что и где получить."
        uz: "Ishga tegishli hamma narsani: shartnomalar, yozishmalar, qarorlar, chaqiruv qogʻozlari, kvitansiyalar. Hujjatlar boʻlmasa — hechqisi yoʻq: yurist nimani va qayerdan olishni aytib beradi."
        en: "Anything related to the case: contracts, correspondence, rulings, summonses, receipts. If you don’t have documents, that’s fine — the lawyer will tell you what to obtain and where."
    - question:
        ru: Можно ли проконсультироваться анонимно?
        uz: Anonim maslahat olish mumkinmi?
        en: Can I consult anonymously?
      answer:
        ru: Да. На первой консультации можно не называть имена и компании — достаточно описать ситуацию. В любом случае всё сказанное остаётся адвокатской тайной.
        uz: Ha. Birinchi maslahatda ismlar va kompaniyalarni aytmasangiz ham boʻladi — vaziyatni tasvirlash kifoya. Har qanday holatda aytilganlar advokatlik siri boʻlib qoladi.
        en: Yes. At the first consultation you don’t have to name people or companies — describing the situation is enough. Either way, everything you say stays privileged.
    - question:
        ru: Что происходит после консультации?
        uz: Maslahatdan keyin nima boʻladi?
        en: What happens after the consultation?
      answer:
        ru: "Вы получаете план действий, сроки и стоимость. Решение — за вами: можно взять паузу, задать дополнительные вопросы или сразу заключить договор."
        uz: "Siz harakat rejasi, muddat va narxni olasiz. Qaror — sizniki: oʻylab koʻrishingiz, qoʻshimcha savollar berishingiz yoki darhol shartnoma tuzishingiz mumkin."
        en: "You receive an action plan, timeline and fee. The decision is yours: take time to think, ask more questions or sign a contract straight away."
