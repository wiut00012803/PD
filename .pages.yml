media:
  input: src/assets/uploads
  output: /uploads
  extensions:
    - jpg
    - jpeg
    - png
    - webp
    - avif
  rename: safe
content:
  - name: settings
    label: Контакты и ссылки
    type: file
    path: src/content/settings.yaml
    format: yaml
    fields:
      - name: siteName
        label: Название фирмы
        type: string
        required: true
        options:
          maxlength: 40
      - name: phone
        label: Телефон
        type: string
        required: true
        pattern:
          regex: ^\+998 \d{2} \d{3}-\d{2}-\d{2}$
          message: Телефон в формате +998 90 123-45-67
      - name: email
        label: Email
        type: string
        required: true
        pattern:
          regex: ^[^\s@]+@[^\s@]+\.[^\s@]{2,}$
          message: Email в формате name@example.uz
      - name: telegram
        label: Telegram
        description: Имя пользователя без @. Кнопки Telegram откроют https://t.me/имя
        type: string
        required: true
        pattern:
          regex: ^[A-Za-z][A-Za-z0-9_]{4,31}$
          message: Имя пользователя Telegram без @ и без ссылки, например pravoedelo
      - name: whatsapp
        label: WhatsApp
        description: Номер только цифрами. Кнопки WhatsApp откроют чат с этим номером
        type: string
        required: true
        pattern:
          regex: ^998\d{9}$
          message: Номер WhatsApp только цифрами, начиная с 998, например 998901234567
      - name: formUrl
        label: Ссылка на Google Форму заявки
        description: Куда ведут кнопки «Заполнить заявку» и «Записаться на консультацию»
        type: string
        required: true
        pattern:
          regex: ^https:\/\/(forms\.gle\/|docs\.google\.com\/forms\/)\S+$
          message: "Ссылка на Google Форму: https://forms.gle/… или https://docs.google.com/forms/…"
      - name: address
        label: Адрес
        type: object
        fields:
          - name: ru
            label: RU · Русский
            type: string
            required: true
            options:
              maxlength: 140
          - name: uz
            label: UZ · Oʻzbekcha
            type: string
            options:
              maxlength: 140
          - name: en
            label: EN · English
            type: string
            options:
              maxlength: 140
      - name: hours
        label: Часы работы
        type: object
        fields:
          - name: ru
            label: RU · Русский
            type: string
            required: true
            options:
              maxlength: 90
          - name: uz
            label: UZ · Oʻzbekcha
            type: string
            options:
              maxlength: 90
          - name: en
            label: EN · English
            type: string
            options:
              maxlength: 90
      - name: mapQuery
        label: Адрес для карты
        description: "Как найти офис в Google Maps: адрес или название. Карта на сайте покажет эту точку"
        type: string
        required: true
        options:
          maxlength: 200
      - name: practiceSince
        label: Год начала адвокатской практики
        description: Из него считается стаж. В текстах пишите {years} — число лет, {yearsWord} — слово «лет/год/года»
        type: number
        required: true
        options:
          min: 1950
          max: 2100
      - name: founded
        label: Год основания бюро
        type: number
        required: true
        options:
          min: 1950
          max: 2100
      - name: socials
        label: Соцсети
        description: Иконки в подвале сайта
        type: object
        list:
          max: 7
          collapsible:
            collapsed: true
            summary: "{fields.network}"
        fields:
          - name: network
            label: Соцсеть
            type: select
            required: true
            options:
              values:
                - name: telegram
                  label: Telegram
                - name: whatsapp
                  label: WhatsApp
                - name: instagram
                  label: Instagram
                - name: facebook
                  label: Facebook
                - name: youtube
                  label: YouTube
                - name: x
                  label: X (Twitter)
                - name: tiktok
                  label: TikTok
          - name: url
            label: Ссылка
            type: string
            required: true
            pattern:
              regex: ^https:\/\/[^\s<>"]+\.[^\s<>"]+$
              message: Полная ссылка, начинается с https://
      - name: privacyUrl
        label: Ссылка на политику конфиденциальности
        description: Если пусто — ссылка в подвале не показывается
        type: string
        pattern:
          regex: ^$|^https:\/\/[^\s<>"]+\.[^\s<>"]+$
          message: Полная ссылка, начинается с https://
      - name: seo
        label: Поисковики и соцсети
        type: object
        fields:
          - name: title
            label: Заголовок вкладки и поисковой выдачи
            type: object
            fields:
              - name: ru
                label: RU · Русский
                type: string
                required: true
                options:
                  maxlength: 70
              - name: uz
                label: UZ · Oʻzbekcha
                type: string
                options:
                  maxlength: 70
              - name: en
                label: EN · English
                type: string
                options:
                  maxlength: 70
          - name: description
            label: Описание для поисковой выдачи
            type: object
            fields:
              - name: ru
                label: RU · Русский
                type: text
                required: true
                options:
