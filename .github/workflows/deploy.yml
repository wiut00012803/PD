name: Публикация сайта
run-name: "Публикация: ${{ github.event_name == 'schedule' && 'ежемесячное обновление' || github.event.head_commit.message || 'ручной запуск' }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Проверка и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получение файлов
        uses: actions/checkout@v7

      - name: Настройка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка контента
        id: content
        env:
          CONTENT_STRICT: ${{ vars.CONTENT_STRICT }}
        run: npm run check:content

      - name: Проверка формы CMS
        run: npm run cms:check

      - name: Проверка кода
        run: npm run check

      - name: Тесты проверки контента
        run: npm run test:content

      - name: Сборка сайта
        run: npx astro build

      - name: Кэш браузера для тестов
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установка браузера для тестов
        run: npx playwright install --with-deps chromium

      - name: Проверка собранного сайта в браузере
        run: npm run test:smoke

      - name: Подготовка к публикации
        uses: actions/configure-pages@v6

      - name: Упаковка сайта
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Отчёт о технической ошибке
        if: failure() && !(steps.content.outcome == 'failure' && steps.content.outputs.reported == 'true')
        run: |
          {
            echo "## ❌ Изменения НЕ опубликованы"
            echo
            echo "Сайт показывает **предыдущую версию**. Сбой произошёл на техническом шаге, а не в контенте: отправьте ссылку на эту страницу разработчику."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Итог
        run: |
          {
            echo "## 🌐 Сайт обновлён"
            echo
            echo "Новая версия опубликована: ${{ steps.deployment.outputs.page_url }}"
            echo
            echo "Если изменений не видно — обновите страницу с очисткой кэша (Ctrl+F5) или подождите пару минут."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Отчёт о сбое публикации
        if: failure()
        run: |
          {
            echo "## ❌ Изменения НЕ опубликованы"
            echo
            echo "Проверка и сборка прошли, но GitHub Pages не принял новую версию — сайт показывает **предыдущую**. Перезапустите публикацию (Re-run jobs) или отправьте ссылку на эту страницу разработчику."
          } >> "$GITHUB_STEP_SUMMARY"
